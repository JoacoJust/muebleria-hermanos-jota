<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mueblería Hermanos Jota — Detalle de producto</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

      <a href="index.html" class="header__logo">

      <nav class="nav">
        <ul class="nav__lista">
