<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Banner — Mueblería Hermanos Jota</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header class="hero-banner">
      <h1 class="hero-banner__titulo">Mueblería Hermanos Jota</h1>
      <p class="hero-banner__texto">
        Diseño artesanal en madera maciza, hecho para durar generaciones.
      </p>
      <a class="hero-banner__cta" href="#catalogo">Ver catálogo</a>
    </header>

    <main class="contenido" id="catalogo">
      <h2 class="seccion__titulo">Nuestro catálogo</h2>
      <p>
        El hero de arriba ocupa exactamente 100vh: una pantalla completa,
        sin importar el alto del navegador. Al hacer scroll aparece el resto
        del contenido.
      </p>
    </main>
  </body>
</html>
